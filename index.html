<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fdeef3">
<title>Hu nyang Mini Game Collection - v4.8.38</title>
<style>
html,body{margin:0;min-height:100%;background:#0d0c19;color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
#boot b{display:block;font-size:22px;margin-bottom:8px;color:#ff9bc9}

</style>

<body>
<div id="boot"><div><b>Hu nyang v4.8.38</b><small>게임 데이터를 불러오는 중...</small></div></div>
<script>
(async()=>{
  try{
    const r=await fetch("./builds/v4.8.37-base.html?for=v4.8.38",{cache:'no-store'});
    if(!r.ok)throw new Error('base HTTP '+r.status);
    let html=await r.text();
    const rep=(a,b,label)=>{if(!html.includes(a))throw new Error('patch anchor: '+label);html=html.replace(a,b)};
    rep("<title>Hu nyang Mini Game Collection - v4.8.30 RPG ATB & Slime Rebalance</title>","<title>Hu nyang Mini Game Collection - v4.8.38 Settings & FPS</title>",'title');
    rep('</style>',"\n/* ===== v4.8.38 global settings / frame presentation ===== */\n:root{--hu-frame-step:16.667ms}\n.mobileSettingsBtn{display:flex!important}\n.homeHeaderActions{display:flex;align-items:center;gap:8px}\n.homeSettingsBtn{font-size:19px}\n.settingsSection{margin:0 0 12px;padding:12px;border-radius:18px;background:#fff;border:1px solid #ecd4df;text-align:left;box-shadow:inset 0 1px rgba(255,255,255,.9)}\n.settingsSectionTitle{font-size:12px;font-weight:1000;color:#8e6175;letter-spacing:.06em;margin-bottom:8px}\n.settingsOptionRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 4px}\n.settingsOptionRow+.settingsOptionRow{border-top:1px solid #f2e2e9}\n.settingsOptionRow b{display:block;color:#684b59;font-size:13px}\n.settingsOptionRow small{display:block;margin-top:3px;color:#a1818f;font-size:9px;line-height:1.4;font-weight:700}\n.fpsChoice{display:flex;gap:5px;flex:0 0 auto}\n.fpsBtn{min-width:66px;height:34px;padding:0 10px;border-radius:11px;border:1px solid #e6c8d5;background:#fff8fb;color:#9a7183;font-size:10px;font-weight:1000}\n.fpsBtn.active{background:linear-gradient(135deg,#f8aec9,#ee8bb3);color:#fff;border-color:#ee8bb3;box-shadow:0 5px 12px rgba(218,109,151,.17)}\n.settingsSwitch{width:48px;height:28px;padding:3px;border-radius:999px;border:1px solid #e0c6d1;background:#eadfe4;position:relative;flex:0 0 auto;transition:background .16s ease,border-color .16s ease}\n.settingsSwitch i{display:block;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(93,61,76,.20);transform:translateX(0);transition:transform .16s ease}\n.settingsSwitch.on{background:#ef9abb;border-color:#e988af}\n.settingsSwitch.on i{transform:translateX(20px)}\nbody.diagHidden #diagFloatBtn{display:none!important}\n.rpgAtbGauge i{transition:none!important;will-change:width}\n@media(max-width:600px),(pointer:coarse){.homeSettingsBtn{display:flex}}\n</style>",'style');
    rep("<meta name=\"hu-nyang-version\" content=\"4.8.35-character-inventory-inn\">","<meta name=\"hu-nyang-version\" content=\"4.8.38-settings-fps-patchnotes\">",'meta');
    rep("<div class=\"splashVersion\" aria-label=\"현재 버전\">v4.8.37</div>","<div class=\"splashVersion\" aria-label=\"현재 버전\">v4.8.38</div>",'splash-version');
    rep("        <button class=\"iconBtn homeReturnBtn\" id=\"returnToSplash\" type=\"button\" aria-label=\"처음 화면으로\">⌂</button>","        <div class=\"homeHeaderActions\">\\n          <button class=\"iconBtn homeSettingsBtn\" id=\"homeSettingsBtn\" type=\"button\" aria-label=\"설정\">⚙</button>\\n          <button class=\"iconBtn homeReturnBtn\" id=\"returnToSplash\" type=\"button\" aria-label=\"처음 화면으로\">⌂</button>\\n        </div>",'home-gear');
    rep("<div class=\"homeVersion\" aria-label=\"현재 버전\">v4.8.37</div>","<div class=\"homeVersion\" aria-label=\"현재 버전\">v4.8.38</div>",'home-version');
    rep("      <button class=\"settingsPatchBtn\" id=\"settingsPatchBtn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"settingsPatchPanel\">","      <div class=\"settingsSection\" id=\"settingsDisplaySection\">\n        <div class=\"settingsSectionTitle\">화면 설정</div>\n        <div class=\"settingsOptionRow\">\n          <div><b>프레임</b><small>전투 게이지와 UI 애니메이션 표시 주기</small></div>\n          <div class=\"fpsChoice\" role=\"group\" aria-label=\"프레임 설정\">\n            <button type=\"button\" class=\"fpsBtn\" id=\"fps30Btn\" data-fps=\"30\">30 FPS</button>\n            <button type=\"button\" class=\"fpsBtn\" id=\"fps60Btn\" data-fps=\"60\">60 FPS</button>\n          </div>\n        </div>\n        <div class=\"settingsOptionRow\">\n          <div><b>진단 아이콘</b><small>화면 우측의 자가진단 아이콘 표시</small></div>\n          <button type=\"button\" class=\"settingsSwitch\" id=\"diagVisibilityToggle\" role=\"switch\" aria-checked=\"true\"><i></i></button>\n        </div>\n      </div>\n      <button class=\"settingsPatchBtn\" id=\"settingsPatchBtn\" type=\"button\" aria-expanded=\"false\" aria-controls=\"settingsPatchPanel\">",'settings-controls');
    rep("      <div class=\"settingsPatchPanel\" id=\"settingsPatchPanel\" aria-hidden=\"true\">","      <div class=\"settingsPatchPanel\" id=\"settingsPatchPanel\" aria-hidden=\"true\">\n        <details class=\"patchVersion\" open>\n          <summary><span>v4.8.38</span><small>NEW</small></summary>\n          <ul>\n            <li>홈 화면과 게임 리스트 상단에 설정 톱니바퀴를 배치하고 PC/모바일 설정 진입점을 통합</li>\n            <li>전역 30 FPS / 60 FPS 표시 옵션 추가 · 전투 판정 속도와 분리해 ATB 게이지를 부드럽게 표시</li>\n            <li>자가진단 아이콘 표시 ON/OFF 옵션 추가 · 설정값은 세이브 슬롯과 별개로 기기에 저장</li>\n            <li>최근 냥PG 월드 변경 내역을 패치 노트에 보강</li>\n          </ul>\n        </details>\n        <details class=\"patchVersion\">\n          <summary><span>v4.8.37</span></summary>\n          <ul>\n            <li>자동 사냥 토글 입력을 pointerdown 기반으로 개선해 한 번의 입력으로 즉시 전환</li>\n            <li>여관 휴식 시 플레이어와 AI 파티원의 HP/MP 및 필드 상태를 함께 동기화</li>\n            <li>여관 회복 전후 수치·경과 턴·소모 골드를 진단 로그에 기록</li>\n          </ul>\n        </details>\n        <details class=\"patchVersion\">\n          <summary><span>v4.8.36</span></summary>\n          <ul>\n            <li>자동 사냥, 파티 상태, 장비창/인벤토리 분리, 아이템 상세 팝업 추가</li>\n            <li>전투 입력 경로와 진단 로그를 보강하고 사냥터 장식/뒤로가기 UI를 정리</li>\n          </ul>\n        </details>\n        <details class=\"patchVersion\">\n          <summary><span>v4.8.35</span></summary>\n          <ul>\n            <li>장비점 구매·판매·재매입, 40칸 인벤토리, 캐릭터 관리 메뉴 추가</li>\n            <li>전투 후 HP/MP 지속과 라비엔 여관 휴식 시스템 추가</li>\n          </ul>\n        </details>",'patch-notes');
    rep("  const VERSION='4.8.37';","  const VERSION='4.8.38';",'diag-version');
    rep("$('#mobileSettingsBtn')?.addEventListener('click',()=>{\\n  HuNyangDiag.line('SETTINGS_OPEN');setAppModal('settingsModal',true);\\n});","function openGlobalSettings(source='unknown'){\\n  HuNyangDiag.line('SETTINGS_OPEN',source);\\n  if(window.HuNyangSettings?.syncUI)window.HuNyangSettings.syncUI();\\n  setAppModal('settingsModal',true);\\n}\\n$('#mobileSettingsBtn')?.addEventListener('click',()=>openGlobalSettings('splash'));\\n$('#homeSettingsBtn')?.addEventListener('click',()=>openGlobalSettings('game_list'));",'settings-events');
    const close='</scr'+'ipt>';
    const at=html.lastIndexOf(close);
    if(at<0)throw new Error('final script close');
    html=html.slice(0,at)+"\n/* ===== v4.8.38 global settings + smooth ATB presentation ===== */\nconst HuNyangSettings=(()=>{\n  const KEY='hunyang_global_settings_v1';\n  const defaults={fps:60,diagVisible:true};\n  let data={...defaults};\n  try{\n    const saved=JSON.parse(localStorage.getItem(KEY)||'null');\n    if(saved&&typeof saved==='object')data={...defaults,...saved};\n  }catch(_){data={...defaults}}\n  data.fps=data.fps===30?30:60;\n  data.diagVisible=data.diagVisible!==false;\n  function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(_){}}\n  function apply(){\n    document.documentElement.style.setProperty('--hu-frame-step',data.fps===30?'33.333ms':'16.667ms');\n    document.body.classList.toggle('diagHidden',!data.diagVisible);\n  }\n  function syncUI(){\n    document.querySelectorAll('.fpsBtn').forEach(btn=>btn.classList.toggle('active',Number(btn.dataset.fps)===data.fps));\n    const sw=document.getElementById('diagVisibilityToggle');\n    if(sw){sw.classList.toggle('on',data.diagVisible);sw.setAttribute('aria-checked',data.diagVisible?'true':'false')}\n  }\n  function setFps(v){\n    const next=Number(v)===30?30:60;if(data.fps===next)return;\n    data.fps=next;save();apply();syncUI();HuNyangDiag.line('SETTINGS_FPS',next+'fps');\n  }\n  function toggleDiag(){\n    data.diagVisible=!data.diagVisible;save();apply();syncUI();HuNyangDiag.line('SETTINGS_DIAG_ICON',data.diagVisible?'ON':'OFF');\n  }\n  apply();\n  return {data,setFps,toggleDiag,syncUI,apply};\n})();\nwindow.HuNyangSettings=HuNyangSettings;\n$$('.fpsBtn').forEach(btn=>btn.addEventListener('pointerdown',e=>{e.preventDefault();HuNyangSettings.setFps(btn.dataset.fps)}));\n$('#diagVisibilityToggle')?.addEventListener('pointerdown',e=>{e.preventDefault();HuNyangSettings.toggleDiag()});\nHuNyangSettings.syncUI();\n\nlet huGaugeFrameLast=0;\nconst huGaugeVisual=new Map();\nfunction huGaugeInterpolated(key,target,dt){\n  target=Math.max(0,Math.min(100,Number(target)||0));\n  let current=huGaugeVisual.has(key)?huGaugeVisual.get(key):target;\n  if(target+25<current) current=target;\n  else{\n    const alpha=Math.min(1,Math.max(.08,dt/92));\n    current += (target-current)*alpha;\n    if(Math.abs(target-current)<.025)current=target;\n  }\n  huGaugeVisual.set(key,current);\n  return current;\n}\nfunction huSmoothBattleGauges(now){\n  requestAnimationFrame(huSmoothBattleGauges);\n  const fps=HuNyangSettings.data.fps||60;\n  const step=1000/fps;\n  if(now-huGaugeFrameLast<step*.88)return;\n  const dt=huGaugeFrameLast?Math.min(80,now-huGaugeFrameLast):step;\n  huGaugeFrameLast=now;\n  const f=(typeof rpgState!=='undefined')?rpgState.field:null;\n  if(!f?.battle){huGaugeVisual.clear();return}\n  const setWidth=(el,v)=>{if(el)el.style.width=`${Math.max(0,Math.min(100,v))}%`};\n  const partyRows=document.querySelectorAll('#rpgPartyStatus .rpgPartyStatus');\n  const partyUnits=document.querySelectorAll('#rpgCombatParty .rpgCombatUnit:not(.empty)');\n  f.party?.forEach((u,i)=>{\n    const v=huGaugeInterpolated('p:'+i,u.gauge,dt);\n    setWidth(partyRows[i]?.querySelector('.rpgAtbGauge i'),v);\n    setWidth(partyUnits[i]?.querySelector('.rpgAtbGauge i'),v);\n  });\n  const enemyUnits=document.querySelectorAll('#rpgCombatEnemy .rpgCombatUnit');\n  f.battle.enemies?.forEach((u,i)=>{\n    const v=huGaugeInterpolated('e:'+i,u.gauge,dt);\n    setWidth(enemyUnits[i]?.querySelector('.rpgAtbGauge i'),v);\n  });\n}\nrequestAnimationFrame(huSmoothBattleGauges);\nHuNyangDiag.line('SETTINGS_BOOT',`fps=${HuNyangSettings.data.fps}|diag=${HuNyangSettings.data.diagVisible?'ON':'OFF'}`);\n"+html.slice(at);
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.getElementById('boot').innerHTML='<div><b>v4.8.38 로드 실패</b><small>'+String(err.message||err)+'</small></div>';
  }
})();
</script>
</body>
</html>

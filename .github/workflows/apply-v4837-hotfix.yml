name: Apply v4.8.38 safe build
on:
  push:
    paths:
      - ".github/workflows/apply-v4837-hotfix.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch exact v4.8.37 to v4.8.38
        shell: python
        run: |
          from pathlib import Path
          import json, gzip, base64, hashlib
          p=Path("index.html")
          raw=p.read_bytes()
          expected="8ca4f85c32b991ac0924feb5604eebc01b1509f0c9de67f1ce1ba243be8b7552"
          got=hashlib.sha256(raw).hexdigest()
          if got != expected:
              raise SystemExit(f"base mismatch: {got}")
          s=raw.decode("utf-8")
          payload="".join(Path(f".github/v4838safe/chunk{i}.txt").read_text().strip() for i in range(1,4))
          ops=json.loads(gzip.decompress(base64.b64decode(payload)).decode("utf-8"))
          for n,(typ,old,new) in enumerate(ops,1):
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f"patch op {n} expected 1 match, got {count}")
              s=s.replace(old, old+new if typ=="after" else new, 1)
          out=s.encode("utf-8")
          final="5069ae4fc2052e730375f753a8f3f10554d84ed9e92dcaa38a0467b662756d06"
          actual=hashlib.sha256(out).hexdigest()
          if actual != final:
              raise SystemExit(f"output mismatch: {actual}")
          p.write_bytes(out)
          print("v4.8.38 patch applied:",len(ops),"ops")
      - name: Commit v4.8.38
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy 냥PG 월드 v4.8.38"
          git push origin main

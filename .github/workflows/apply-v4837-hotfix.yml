name: Apply v4.8.38 build
on:
  push:
    paths:
      - ".github/workflows/apply-v4837-hotfix.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch index.html to v4.8.38
        shell: python
        run: |
          from pathlib import Path
          import json, gzip, base64, hashlib

          p = Path("index.html")
          raw = p.read_bytes()
          expected = "8ca4f85c32b991ac0924feb5604eebc01b1509f0c9de67f1ce1ba243be8b7552"
          got = hashlib.sha256(raw).hexdigest()
          if got != expected:
              raise SystemExit(f"index.html base mismatch: {got}")

          payload = "".join(
              Path(f".github/v4838/chunk{i}.txt").read_text(encoding="utf-8").strip()
              for i in range(1, 3)
          )
          ops = json.loads(gzip.decompress(base64.b64decode(payload)).decode("utf-8"))
          lines = raw.decode("utf-8").splitlines(keepends=True)

          for tag, a1, a2, new_text in reversed(ops):
              lines[a1:a2] = [new_text] if new_text else []

          out = "".join(lines).encode("utf-8")
          final = "5069ae4fc2052e730375f753a8f3f10554d84ed9e92dcaa38a0467b662756d06"
          actual = hashlib.sha256(out).hexdigest()
          if actual != final:
              raise SystemExit(f"patched output mismatch: {actual}")

          p.write_bytes(out)

      - name: Commit v4.8.38
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Deploy 냥PG 월드 v4.8.38"
          git push origin main

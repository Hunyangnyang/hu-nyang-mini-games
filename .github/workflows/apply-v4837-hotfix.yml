name: Apply v4.8.37 build
on:
  push:
    paths:
      - ".github/workflows/apply-v4837-hotfix.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch index.html to v4.8.37
        shell: python
        run: |
          from pathlib import Path
          import json, gzip, base64

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          parts = []
          for i in range(1, 6):
              parts.append(Path(f".github/v4837/chunk{i}.txt").read_text(encoding="utf-8").strip())
          payload = "".join(parts)
          ops = json.loads(gzip.decompress(base64.b64decode(payload)).decode("utf-8"))

          for typ, old, new in ops:
              if old not in s:
                  raise SystemExit("patch anchor missing: " + repr(old[:180]))
              if typ == "replace":
                  s = s.replace(old, new, 1)
              elif typ == "after":
                  s = s.replace(old, old + new, 1)
              else:
                  raise SystemExit("unknown patch operation: " + typ)

          checks = ["v4.8.37", "RPG_AUTO_BATTLE_INPUT", "RPG_INN_REST", "rpgPartyStatusPage"]
          missing = [x for x in checks if x not in s]
          if missing:
              raise SystemExit("post-patch verification failed: " + ", ".join(missing))

          p.write_text(s, encoding="utf-8")
          print("Applied", len(ops), "operations")

      - name: Commit v4.8.37
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Deploy 냥PG 월드 v4.8.37"
          git push origin main

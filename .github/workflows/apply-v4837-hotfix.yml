name: Apply v4.8.37 build
on:
  push:
    paths:
      - ".github/workflows/apply-v4837-hotfix.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch current v4.8.35 to v4.8.37
        shell: python
        env:
          DELTA_B64: ""
        run: |
          from pathlib import Path
          import os, json, gzip, base64
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          ops=json.loads(gzip.decompress(base64.b64decode(os.environ["DELTA_B64"])).decode("utf-8"))
          applied=0
          for typ,old,new in ops:
              if typ=="replace":
                  if old not in s:
                      raise SystemExit("replacement anchor missing: "+repr(old[:140]))
                  s=s.replace(old,new,1)
              else:
                  if old not in s:
                      raise SystemExit("insert anchor missing: "+repr(old[:140]))
                  s=s.replace(old,old+new,1)
              applied+=1
          if "v4.8.37" not in s or "RPG_AUTO_BATTLE_INPUT" not in s or "RPG_INN_REST" not in s:
              raise SystemExit("post-patch verification failed")
          p.write_text(s,encoding="utf-8")
          print("applied operations:",applied)
      - name: Commit v4.8.37
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy 냥PG 월드 v4.8.37"
          git push origin main

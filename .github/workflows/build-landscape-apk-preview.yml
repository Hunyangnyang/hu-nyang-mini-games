name: Build Landscape APK Preview

on:
  push:
    branches:
      - preview/landscape-apk-v4838

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct embedded game HTML
        shell: bash
        run: |
          mkdir -p apk-preview/app/src/main/assets
          find apk-preview/chunks -type f -name 'part*' -print0 | sort -z | xargs -0 cat > apk-preview/app/src/main/assets/index.html
          echo "HTML bytes: $(wc -c < apk-preview/app/src/main/assets/index.html)"

      - name: Build debug APK
        run: gradle -p apk-preview :app:assembleDebug --no-daemon

      - name: Prepare APK
        shell: bash
        run: |
          cp apk-preview/app/build/outputs/apk/debug/app-debug.apk Hu_nyang_v4_8_38_Landscape_Preview.apk
          ls -lh Hu_nyang_v4_8_38_Landscape_Preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hu_nyang_v4_8_38_Landscape_Preview
          path: Hu_nyang_v4_8_38_Landscape_Preview.apk
          if-no-files-found: error
